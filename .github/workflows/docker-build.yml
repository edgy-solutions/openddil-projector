name: Docker Build

on:
  push:
    branches: [ "master" ]
    # Tag pushes (v1.0.0, ...) publish a versioned image (:v1.0.0)
    # so consumers can pin to a release. A tag does not move :latest.
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Publishes ghcr.io/edgy-solutions/openddil/projector. :latest is what
# openddil-demo/docker-compose.yml references for the openddil-projector
# service. `${{ github.repository_owner }}` resolves to `edgy-solutions`.
#
# Tags, on every image:
#   :sha-<7>  every build, from the commit it built. On a pull request that is
#             the branch head, not GitHub's merge commit, so the tag names a
#             commit that exists on the branch.
#   :pr-<N>   a pull request build.
#   :<tag>    a v* tag push.
#   :latest   a push or a dispatch on master, and nothing else. A branch, a
#             pull request or a tag never moves it.
# A pull request from a fork builds but pushes nothing: its token cannot write
# packages.

jobs:
  build-projector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<7> always, :pr-<N> on a pull request, :<tag> on a v* tag;
      # :latest only from master.
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/projector
          T="$REG:sha-${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build projector
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
