# produces.yaml -- every Kafka topic this repo's workloads can write, as templates over the workload's environment.
# Checked against the code by src/tests/test_produces_manifest.py and against the chart by
# openddil-helm scripts/check-produces-declarations.py.
workloads:
  # The hub and the per-tier workloads run the same code. The projector consumes into Postgres; its one producer is
  # the link heartbeat (edge_buffer_monitor.py), written to the tier's own broker when LINK_HEARTBEAT_ENABLED is set.
  projector:
    image: openddil/projector
    topics:
      - link-heartbeat
